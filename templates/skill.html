{% extends 'base.html' %}
{% block content %}


<section id="skills" class="container mt-5">
  <h2 class="text-center section-title mb-4">Skills</h2>

  <div class="d-flex flex-column align-items-center">
    {% for i in skill %}
      <div class="card text-center mb-3" style="width:500px;">
          <p class="p-3 fw-bold">{{ i.skill }}</p>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
