{% extends 'base.html' %}
{% block content %}

<section id="projects" class="container mt-5">
  <h2 class="text-center section-title">Projects</h2>

  <div class="row">
    {% for project in project %}
    <div class="col-md-4">
      <div class="card p-5">
        <h5>{{project.title}}</h5>
        <p>{{project.description}}</p>
    <a href="{{project.link}}" class="btn btn-primary">Go to Project</a> 
    </div>
      
    </div>
    {% endfor %}

  </div>
</section>
{% endblock %}
