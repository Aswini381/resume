<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

      .profile {
    position: relative;
    width: 450px;
    height: 450px;
}

.profile-ring {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: conic-gradient(
        black,
        white,
        black,
        white,
        black
    );
    animation: spin 3s linear infinite;
}

.profile img {
    position: absolute;
    top : 10px;
    left : 10px;
    width: 430px;
    height: 430px;
    object-fit: cover;
    border-radius: 50%;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

  .ai-btn{
    border-radius : 30px;
    padding : 12px 24px;
    font-weight : bold;
  }
  .chatbot{
    max-width : 700px;
    height : 600px;
    margin : auto;
    border-radius : 20px;
    overflow : hidden;
    box-shadow : 0 5px 25px rgba(52, 50, 58, 0.2);
    background : white;
  }
  .chat-header{
    padding : 20px;
    font-size : 22px;
    font-weight : bold;
    text-align : center;
    background : grey;
    color : white;
  }
  .chat-body{
    height : 470px;
    padding : 20px;
    overflow-y : auto;
  }
  .bot-message{
    background : #f1f1f1;
    padding : 12px 14px;
    border-radius : 15px;
    max-width : 80%;
  }
  .chat-input{
    display : flex;
    gap : 10px;
    padding : 15px;
    border-top: 1px solid #ddd;
  }
  .user-message{
    background : #909296;
    color : white;
    padding : 12px 16px;
    border-radius : 15px;
    max-width : 80%;
    margin-left :auto;
    margin-bottom : 15px;
    margin-top : 10px;
  }
    </style>


  </head>

<body>
 <header>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand text-white" href="{% url 'home' %}">My Portfolio</a>

    <!-- Hamburger icon -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCategories">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Categories -->
    <div class="collapse navbar-collapse" id="navbarCategories">
  <ul class="navbar-nav ms-auto">
    <li class="nav-item">
      <a class="nav-link text-white me-3" href="{% url 'about_me' %}">About Me</a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white me-3" href="{% url 'project' %}">Projects</a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white me-3" href="{% url 'skill' %}">Skills</a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white" href="{% url 'contact' %}">Contact</a>
    </li>
  </ul>
</div>

  </div>
</nav>
</header>


{% block content %}
{% endblock %}

<footer class="bg-dark text-white text-center py-3 mt-5  fixed-bottom">
    <div class="container-fluid">
        <p class="mb-0">My Portfolio | Built by Aswini</p>
    </div>
</footer>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
